<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão de Visitas</title>
</head>
<body>
    <h1>Gerador de Cartão de Visitas</h1>
    <div class="layout">
        <div class="controls">
            <input type="text" id="nomeInput" placeholder = "Digite seu nome">
            <input type="text" id="cargoInput" placeholder = "Digite seu cargo">
            <label for="corInput">Escolha a cor:</label>
            <select id="corInput">
                <option value="#ffffff">Branco</option>
                <option value="#dc3545">Vermelho</option>
                <option value="#ffc107">Amarelo</option>
                <option value="#28a745">Verde</option>
                <option value="#007bff">Azul</option>
            </select>
        </div>

        <div id="cartao">
            <h2 id="nomeCartao">Nome</h2>
            <p id="cargoCartao">Cargo</p>
        </div>
    </div>

    <style>
        .layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #cartao {
            width: 300px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--cor-cartao, #fff);
        }
    </style>
    <script src="rev2.js"></script>
</body>
</html>
